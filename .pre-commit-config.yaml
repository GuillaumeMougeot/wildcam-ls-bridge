# Local hooks only (run through uv, no hook repositories to download).
# Install once with:  uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: no-secrets
        name: no secrets from .env in committed files
        entry: uv run python scripts/check_no_secrets.py
        language: system
      - id: no-env-file
        name: never commit .env
        entry: .env files must not be committed
        language: fail
        files: (^|/)\.env$
      - id: no-large-files
        name: no large files (videos belong on ERDA)
        entry: uv run python -c "import sys,os; big=[f for f in sys.argv[1:] if os.path.getsize(f)>2_000_000]; print(*big); sys.exit(bool(big))"
        language: system
