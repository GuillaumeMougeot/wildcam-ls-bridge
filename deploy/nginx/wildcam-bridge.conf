# wildcam-ls-bridge -> installed as /etc/nginx/snippets/wildcam-bridge.conf
#
# Must be included INSIDE the TLS server block of the Label Studio site
# (/etc/nginx/sites-available/wildcam, the block with `listen 443 ssl`):
#
#     include /etc/nginx/snippets/wildcam-bridge.conf;
#
# Encryption: that block terminates TLS with the Let's Encrypt certificate (certbot), and the
# port-80 block redirects to HTTPS, so CSV uploads and result downloads are always encrypted.
# The bridge itself listens on 127.0.0.1:8090 only and rejects requests without
# X-Forwarded-Proto=https (BRIDGE_REQUIRE_HTTPS=true).

location = /bridge {
    return 301 /bridge/;
}

location /bridge/ {
    # Rate limit per client IP (zone defined in conf.d/wildcam-bridge-ratelimit.conf).
    limit_req zone=wildcam_bridge burst=20 nodelay;
    limit_req_status 429;

    # Optional: only allow the database server(s) to reach the API.
    # allow 192.0.2.10;
    # deny all;

    client_max_body_size 25m;   # must be >= BRIDGE_MAX_CSV_BYTES
    proxy_read_timeout 300s;    # exporting results of a large project can take a while

    # Trailing slash: /bridge/api/v1/jobs is forwarded as /api/v1/jobs.
    proxy_pass http://127.0.0.1:8090/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /bridge;

    add_header Strict-Transport-Security "max-age=31536000" always;
}
