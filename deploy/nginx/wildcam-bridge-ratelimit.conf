# wildcam-ls-bridge -> installed as /etc/nginx/conf.d/wildcam-bridge-ratelimit.conf
# (conf.d/*.conf is included in the `http {}` context on Debian/Ubuntu.)
# 5 requests/second per client IP on /bridge/, bursts of 20 allowed (see snippet).
limit_req_zone $binary_remote_addr zone=wildcam_bridge:10m rate=5r/s;
