[project]
name = "wildcam-ls-bridge"
version = "0.1.0"
description = "Secure HTTP bridge: SQL/CSV video selections -> AU ERDA (SFTP) -> Label Studio projects -> annotation results."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncssh>=2.14",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.scripts]
wildcam-bridge = "wildcam_bridge.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wildcam_bridge"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit (security)
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "PTH",      # prefer pathlib
]
ignore = [
    "S104",  # binding to 0.0.0.0 is only used when explicitly configured
]

[tool.ruff.lint.isort]
known-first-party = ["wildcam_bridge", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["wildcam_bridge"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncssh.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not e2e'"
markers = [
    "e2e: end-to-end tests that start a real, throw-away Label Studio + SFTP server (slow)",
]
filterwarnings = [
    "ignore::DeprecationWarning:asyncssh.*",
    # starlette>=1.x nudges towards httpx2 for its TestClient; harmless for our tests
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["wildcam_bridge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
